[project]
name = "candrel"
version = "0.1.0"
description = "Reproducible cross-screen cancer dependency reliability research"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.4.2",
  "requests==2.34.2",
  "scipy==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
candrel-smoke = "candrel.smoke:main"
candrel-processing-sensitivity = "candrel.processing_sensitivity:main"
candrel-msi-wrn-replication = "candrel.msi_wrn_replication:main"
candrel-wrn-ordering = "candrel.wrn_ordering:main"
candrel-wrn-qc-asymmetry = "candrel.wrn_qc_asymmetry:main"
candrel-wrn-guide-mutation-adequacy = "candrel.wrn_guide_mutation_adequacy:main"
candrel-control-discordance = "candrel.control_discordance:main"
candrel-sequence-inclusion-asymmetry = "candrel.sequence_inclusion_asymmetry:main"
candrel-wrn-guide-loo = "candrel.wrn_guide_loo:main"
candrel-wrn-sequence-semantics = "candrel.wrn_sequence_semantics:main"
candrel-wrn-guide-loo-passing = "candrel.wrn_guide_loo_passing:main"
candrel-wrn-process-association = "candrel.wrn_process_association:main"
candrel-paralog-replication = "candrel.paralog_replication:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
