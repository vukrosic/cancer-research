[project]
name = "candrel"
version = "0.1.0"
description = "Reproducible cross-screen cancer dependency reliability research"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.4.2",
  "requests==2.34.2",
  "scipy==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
candrel-smoke = "candrel.smoke:main"
candrel-processing-sensitivity = "candrel.processing_sensitivity:main"
candrel-msi-wrn-replication = "candrel.msi_wrn_replication:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
